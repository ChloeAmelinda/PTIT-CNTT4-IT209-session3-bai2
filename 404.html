<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>404 - Không tìm thấy trang</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }
        main {
            width: 100%;
            max-width: 560px;
            padding: 48px 24px;
            text-align: center;
            background: white;
            border-radius: 20px;
        }
        .code {
            margin: 0;
            font-size: 96px;
            font-weight: bold;
            color: #2563eb;
        }
        h1 { font-size: 26px; }
        p { line-height: 1.6; }
        a {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
        a:focus-visible { outline: 3px solid #0f172a; }
    </style>
</head>
<body>
    <main>
        <p class="code">404</p>
        <h1>Không tìm thấy trang bạn yêu cầu</h1>
        <p>Đường dẫn có thể không chính xác hoặc trang đã được di chuyển.</p>
        <a href="/">Về trang chủ</a>
        <p>Website của Đoàn Trung Nguyên</p>
    </main>
</body>
</html>
